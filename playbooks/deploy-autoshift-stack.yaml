---
# ==============================================================================
# Phase 1: Provision the OpenShift Hub Cluster
# ==============================================================================
- name: Provision OCP Cluster for ACM Hub
  hosts: hub_cluster
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yaml

  tasks:
    # --------------------------------------------------------------------------
    # Step 1: Provision Hub Cluster
    # --------------------------------------------------------------------------
    - name: Ensure prerequisites are met
      ansible.builtin.include_role:
        name: ocp/install_ocp_prerequisites

    - name: Request Elastic IP Quota Increase
      ansible.builtin.include_role:
        name: aws/aws_eip_quota

    - name: Provision Global Hub via IPI
      ansible.builtin.include_role:
        name: ocp/aws_provision_ocp_ipi

    # Since IPI provisions the cluster directly, its kubeconfig is generated locally.
    - name: Set ACM Hub Kubeconfig Path
      ansible.builtin.set_fact:
        hub_kubeconfig: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"

    - name: Create Infrastructure Node Pool
      block:
        - ansible.builtin.include_role:
            name: ocp/aws_create_machineset
          vars:
            target_kubeconfig: "{{ hub_kubeconfig }}"
            pool_name: "infra"
            pool_replicas: "{{ install_config.infra.replicas }}"
            pool_instance_type: "{{ install_config.infra.instance_type }}"
            pool_labels:
              node-role.kubernetes.io/infra: ""
            pool_taints:
              - effect: NoSchedule
                key: node-role.kubernetes.io/infra
      when: install_config.infra is defined

    - name: Create ODF Storage Node Pool
      block:
        - ansible.builtin.include_role:
            name: ocp/aws_create_machineset
          vars:
            target_kubeconfig: "{{ hub_kubeconfig }}"
            pool_name: "storage"
            pool_replicas: "{{ install_config.storage.replicas }}"
            pool_instance_type: "{{ install_config.storage.instance_type }}"
            pool_labels:
              cluster.ocs.openshift.io/openshift-storage: ""
              # Workers label required so standard OVN/Networking pods schedule here
              node-role.kubernetes.io/worker: ""
              node-role.kubernetes.io/storage: ""
            pool_taints:
              - effect: NoSchedule
                key: node.ocs.openshift.io/storage
                value: "true"
      when: install_config.storage is defined

# ==============================================================================
# Phase 2: Install and Configure AutoShift (via OCI Registry)
# ==============================================================================
- name: Install AutoShift Stack (GitOps, ACM, and Policies)
  hosts: hub_cluster
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yaml

  vars:
    gitops_namespace: "openshift-gitops"

  environment:
    KUBECONFIG: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH }}"

  tasks:
    # --------------------------------------------------------------------------
    # Step 1: OpenShift GitOps (From Local Source)
    # --------------------------------------------------------------------------
    - name: Prepare GitOps namespace for Helm adoption
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ gitops_namespace }}"
            annotations:
              meta.helm.sh/release-name: openshift-gitops
              meta.helm.sh/release-namespace: "{{ gitops_namespace }}"
            labels:
              app.kubernetes.io/managed-by: Helm

    - name: Install OpenShift GitOps via Helm Module
      kubernetes.core.helm:
        name: openshift-gitops
        chart_ref: "{{ autoshift_local_path }}/openshift-gitops"
        values_files:
          - "{{ autoshift_local_path }}/policies/stable/openshift-gitops/values.yaml"
        release_namespace: "{{ gitops_namespace }}"
        create_namespace: true
        state: present
        binary_path: "{{ bin_dir }}/helm"

    - name: Wait for OpenShift GitOps Operator to be Ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: openshift-gitops-operator-controller-manager
        namespace: openshift-gitops-operator
      register: gitops_operator
      until: >
        gitops_operator.resources | length > 0 and
        gitops_operator.resources.status.readyReplicas | default(0) > 0
      retries: 30
      delay: 10

    - name: Wait for ArgoCD Server to be Ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: openshift-gitops-server
        namespace: openshift-gitops
      register: argocd_server
      until: >
        argocd_server.resources | length > 0 and
        argocd_server.resources.status.readyReplicas | default(0) > 0
      retries: 60
      delay: 10

    # --------------------------------------------------------------------------
    # Step 2: Advanced Cluster Management (From Local Source)
    # --------------------------------------------------------------------------
    - name: Prepare ACM namespace for Helm adoption
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "open-cluster-management"
            annotations:
              meta.helm.sh/release-name: advanced-cluster-management
              meta.helm.sh/release-namespace: "open-cluster-management"
            labels:
              app.kubernetes.io/managed-by: Helm

    - name: Install Advanced Cluster Management via Helm Module
      kubernetes.core.helm:
        name: advanced-cluster-management
        chart_ref: "{{ autoshift_local_path }}/advanced-cluster-management"
        values_files:
          - "{{ autoshift_local_path }}/policies/stable/advanced-cluster-management/values.yaml"
        release_namespace: "open-cluster-management"
        create_namespace: true
        state: present
        binary_path: "{{ bin_dir }}/helm"

    - name: Wait for ACM MultiClusterHub to be Running (Takes ~10 mins)
      kubernetes.core.k8s_info:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        name: multiclusterhub
        namespace: open-cluster-management
      register: mch_status
      until: >
        mch_status.resources | length > 0 and
        mch_status.resources.status is defined and
        mch_status.resources.status.phase | default('') == 'Running'
      retries: 90
      delay: 10

    # --------------------------------------------------------------------------
    # Step 3: Deploy AutoShift AppSet (From Local Source)
    # --------------------------------------------------------------------------
    - name: Deploy AutoShift via Helm Module
      kubernetes.core.helm:
        name: autoshift
        chart_ref: "{{ autoshift_local_path }}/autoshift"
        release_namespace: "{{ gitops_namespace }}"
        state: present
        binary_path: "{{ bin_dir }}/helm"
        values_files:
          - values/global.yaml
          - values/clustersets/hub-minimal.yaml
        values:
          # Change this to your fork URL if you have pushed custom policy modifications
          autoshiftGitRepo: "https://github.com/auto-shift/autoshiftv2.git"
          autoshiftGitBranchTag: "main"

          # Globally exclude unneeded base policies
          excludePolicies:
            - infra-nodes
            - worker-nodes

          hubClusterSets:
            hub:
              labels:
                # Core Minimal Labels
                openshift-version: '4.20.18'
                self-managed: 'true'

                # Required AutoShift Component: GitOps
                gitops: 'true'
                gitops-subscription-name: openshift-gitops-operator
                gitops-channel: gitops-1.20
                gitops-source: redhat-operators
                gitops-source-namespace: openshift-marketplace
                gitops-disable-default-argocd: 'true'

                # Added Operator: Quay
                quay: 'true'
                quay-subscription-name: quay-operator
                quay-channel: stable-3.17
                quay-source: redhat-operators
                quay-source-namespace: openshift-marketplace

          managedClusterSets:
            managed:
              labels:
                openshift-version: '4.20.18'
                logging: 'true'
                gitops-dev: 'false'

                # --- Advanced Cluster Security (ACS) ---
                acs: 'true'
                acs-subscription-name: rhacs-operator
                acs-egress-connectivity: Online
                acs-channel: stable
                acs-source: redhat-operators
                acs-source-namespace: openshift-marketplace
                acs-monitoring: 'true'

                # --- Compliance Operator ---
                compliance: 'true'
                compliance-auto-remediate: 'true'
                compliance-subscription-name: compliance-operator
                compliance-source: redhat-operators
                compliance-source-namespace: openshift-marketplace
                compliance-channel: stable


    # --------------------------------------------------------------------------
    # Step 4: ClusterSet Labeling
    # --------------------------------------------------------------------------
    - name: Assign local-cluster to Hub ClusterSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cluster.open-cluster-management.io/v1
          kind: ManagedCluster
          metadata:
            name: local-cluster
            labels:
              cluster.open-cluster-management.io/clusterset: hub

# ==============================================================================
# Phase 3: Provision Managed Clusters via ACM
# ==============================================================================
- name: Provision Managed Clusters via ACM
  hosts: managed_clusters
  connection: local
  gather_facts: false

  tasks:
    - name: Set Hub Kubeconfig
      ansible.builtin.set_fact:
        # Dynamically grabs the KUBECONFIG path for the first host in the 'hub_cluster' group
        hub_kubeconfig: "{{ install_dir }}/{{ hostvars[groups['hub_cluster'][0]]['ocp_cluster']['name'] }}/auth/kubeconfig"

    - name: Apply Hive Provisioning Manifests to Hub
      ansible.builtin.include_role:
        name: acm/aws_provision_cluster_via_acm
      vars:
        target_kubeconfig: "{{ hub_kubeconfig }}"

# ==============================================================================
# SUMMARY: Final Environment Handoff
# ==============================================================================
- name: Deployment Summary
  hosts: hub_cluster
  connection: local
  gather_facts: false
  tags: ['summary']
  tasks:
    - name: Fetch Global Hub kubeadmin password
      ansible.builtin.slurp:
        src: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeadmin-password"
      register: hub_password_raw

    - name: Print Final Environment Details
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "🎉 FULL ENVIRONMENT PROVISIONING COMPLETE! 🎉"
          - "=================================================================="
          - "Global Hub Cluster: {{ ocp_cluster.name }}"
          - "Web Console:        https://console-openshift-console.apps.{{ ocp_cluster.name }}.{{ base_domain }}/"
          - "Username:           kubeadmin"
          - "Password:           {{ hub_password_raw.content | b64decode }}"
          - "=================================================================="