---
# ==============================================================================
# Supplemental ACM Policy: Configure ACS to use Infrastructure Nodes
# ==============================================================================
# This policy patches the ACS Central CR to pin deployments to infrastructure
# nodes using the built-in pinToNodes: InfraRole setting.
#
# This policy:
# - Depends on autoshift's policy-acs-central being compliant
# - Uses sync-wave "2" to apply AFTER autoshift's wave "1"
# - Uses complianceType: musthave for additive merging (won't conflict)
# - Can be applied alongside autoshift without ArgoCD conflicts
# ==============================================================================
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-acs-infra-nodes
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  disabled: false
  remediationAction: enforce
  dependencies:
    - name: policy-acs-central
      namespace: policies-autoshift
      apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: Policy
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acs-central-infra-nodes
        spec:
          remediationAction: enforce
          severity: medium
          evaluationInterval:
            compliant: 10m
            noncompliant: 30s
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: platform.stackrox.io/v1alpha1
                kind: Central
                metadata:
                  name: stackrox-central-services
                  namespace: stackrox
                spec:
                  customize:
                    deploymentDefaults:
                      nodeSelector:
                        node-role.kubernetes.io/infra: ""
                      tolerations:
                        - effect: NoSchedule
                          key: node-role.kubernetes.io/infra
                          operator: Exists
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-acs-infra-nodes-placement
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - hub
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/acs'
              operator: In
              values:
                - 'true'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-acs-infra-nodes-placement
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  name: policy-acs-infra-nodes-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-acs-infra-nodes
    apiGroup: policy.open-cluster-management.io
    kind: Policy
