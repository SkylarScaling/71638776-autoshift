---
# ==============================================================================
# Replacement Policy: Create Infrastructure Nodes MachineSets (AWS)
# ==============================================================================
# This policy REPLACES AutoShift's broken policy-infra-nodes-aws.
# It creates infra MachineSets with correct AWS resource references.
#
# WHY THIS REPLACEMENT IS NEEDED:
# AutoShift's policy-infra-nodes-aws has critical bugs:
# 1. Zone label parsing error (generates invalid Go template syntax)
# 2. Instance type label not read (defaults to worker instance type)
# 3. Volume size label not read (field completely missing)
# 4. Uses incorrect AWS resource names (worker-sg vs node, subnet naming)
#
# This policy:
# - Reads cluster infrastructure ID dynamically
# - Uses correct AWS naming conventions for security groups and subnets
# - Properly applies instance type and volume size from cluster labels
# - Creates one MachineSet in the first available AZ (single-AZ deployment)
# - Uses proven, working resource references from actual deployments
# ==============================================================================
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-infra-nodes-machineset-create
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: create-infra-machineset-aws
        spec:
          remediationAction: enforce
          severity: high
          evaluationInterval:
            compliant: 10m
            noncompliant: 30s
          object-templates-raw: |
            {{- $infrastructure_id := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}
            {{- $region := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.platformStatus.aws.region }}
            {{- $instanceType := "{{hub index .ManagedClusterLabels "autoshift.io/infra-nodes-instance-type" hub}}" }}
            {{- $volumeSize := {{hub index .ManagedClusterLabels "autoshift.io/infra-nodes-volume-size" | toInt hub}} }}
            {{- $replicas := {{hub index .ManagedClusterLabels "autoshift.io/infra-nodes" | toInt hub}} }}
            {{- /* Get worker MachineSet to determine AZ and AMI */ -}}
            {{- $worker_ms := dict }}
            {{- range (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "").items }}
              {{- if and (hasPrefix (printf "%s-worker" $infrastructure_id) .metadata.name) (eq (len $worker_ms) 0) }}
                {{- $worker_ms = . }}
              {{- end }}
            {{- end }}
            {{- $zone := $worker_ms.spec.template.spec.providerSpec.value.placement.availabilityZone }}
            {{- $ami := $worker_ms.spec.template.spec.providerSpec.value.ami.id }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: machine.openshift.io/v1beta1
                kind: MachineSet
                metadata:
                  labels:
                    machine.openshift.io/cluster-api-cluster: {{ $infrastructure_id }}
                  name: {{ $infrastructure_id }}-infra-{{ $zone }}
                  namespace: openshift-machine-api
                spec:
                  deletePolicy: Oldest
                  replicas: {{ $replicas }}
                  selector:
                    matchLabels:
                      machine.openshift.io/cluster-api-cluster: {{ $infrastructure_id }}
                      machine.openshift.io/cluster-api-machineset: {{ $infrastructure_id }}-infra-{{ $zone }}
                  template:
                    metadata:
                      labels:
                        machine.openshift.io/cluster-api-cluster: {{ $infrastructure_id }}
                        machine.openshift.io/cluster-api-machine-role: infra
                        machine.openshift.io/cluster-api-machine-type: infra
                        machine.openshift.io/cluster-api-machineset: {{ $infrastructure_id }}-infra-{{ $zone }}
                    spec:
                      metadata:
                        labels:
                          node-role.kubernetes.io/infra: ""
                      taints:
                        - key: node-role.kubernetes.io/infra
                          effect: NoSchedule
                        - key: node-role.kubernetes.io/infra
                          effect: NoExecute
                      providerSpec:
                        value:
                          ami:
                            id: {{ $ami }}
                          apiVersion: machine.openshift.io/v1beta1
                          blockDevices:
                            - ebs:
                                encrypted: true
                                iops: 0
                                volumeSize: {{ $volumeSize }}
                                volumeType: gp3
                          credentialsSecret:
                            name: aws-cloud-credentials
                          deviceIndex: 0
                          iamInstanceProfile:
                            id: {{ $infrastructure_id }}-worker-profile
                          instanceType: {{ $instanceType }}
                          kind: AWSMachineProviderConfig
                          placement:
                            availabilityZone: {{ $zone }}
                            region: {{ $region }}
                          securityGroups:
                            - filters:
                                - name: 'tag:Name'
                                  values:
                                    - {{ $infrastructure_id }}-node
                          subnet:
                            filters:
                              - name: 'tag:Name'
                                values:
                                  - {{ $infrastructure_id }}-subnet-private-{{ $zone }}
                          tags:
                            - name: kubernetes.io/cluster/{{ $infrastructure_id }}
                              value: owned
                          userDataSecret:
                            name: worker-user-data
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-infra-nodes-machineset-create-placement
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterSets:
    - hub
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: 'autoshift.io/infra-nodes'
              operator: Exists
            - key: 'autoshift.io/infra-nodes'
              operator: NotIn
              values:
                - "0"
            - key: 'autoshift.io/infra-nodes-provider'
              operator: In
              values:
                - 'aws'
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-infra-nodes-machineset-create-placement
  namespace: policies-autoshift
  annotations:
    argocd.argoproj.io/sync-wave: "0"
placementRef:
  name: policy-infra-nodes-machineset-create-placement
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policy-infra-nodes-machineset-create
    apiGroup: policy.open-cluster-management.io
    kind: Policy
