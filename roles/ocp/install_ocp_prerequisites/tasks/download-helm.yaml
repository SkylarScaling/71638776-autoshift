---
- name: Check if Helm is already installed
  ansible.builtin.stat:
    path: "{{ bin_dir }}/helm"
  register: helm_binary

- name: Get installed Helm version
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/helm version --template '{{ '{{' }} .Version {{ '}}' }}'"
  register: installed_helm_version
  changed_when: false
  ignore_errors: true
  when: helm_binary.stat.exists

- name: Download and install Helm
  when: >
    not helm_binary.stat.exists or
    installed_helm_version.stdout | default('') != 'v' ~ helm_version or
    force_update | bool
  block:
    - name: Create temporary directory for Helm download
      ansible.builtin.tempfile:
        state: directory
        suffix: helm
      register: helm_temp_dir

    - name: Download and extract Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
        dest: "{{ helm_temp_dir.path }}"
        remote_src: yes

    - name: Move Helm binary to bin_dir
      ansible.builtin.copy:
        src: "{{ helm_temp_dir.path }}/linux-amd64/helm"
        dest: "{{ bin_dir }}/helm"
        mode: '0755'
        remote_src: yes

    - name: Clean up temporary Helm directory
      ansible.builtin.file:
        path: "{{ helm_temp_dir.path }}"
        state: absent

- name: Verify installed Helm version
  ansible.builtin.command: "{{ bin_dir }}/helm version"
  register: helm_version_output
  changed_when: false

- name: Display Helm version
  ansible.builtin.debug:
    msg: "{{ helm_version_output.stdout }}"